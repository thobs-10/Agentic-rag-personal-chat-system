services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__HOST=0.0.0.0
      - QDRANT__SERVICE__HTTP_PORT=6333
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/agentic_rag_personal_chat_system/backend/Dockerfile
    container_name: agentic-rag-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - LOG_LEVEL=INFO
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: src/agentic_rag_personal_chat_system/frontend/Dockerfile
    container_name: agentic-rag-frontend
    ports:
      - "8001:8000"
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agentic-rag-frontend
    ports:
      - "8080:8080"
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - backend

  ingestion:
    build:
      context: .
      dockerfile: src/agentic_rag_personal_chat_system/ingestion/Dockerfile
    container_name: agentic-rag-ingestion
    volumes:
      - ./data/technical:/app/data/technical
      - ./data/personal:/app/data/personal
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
    networks:
      - app-network
    restart: "no"
    depends_on:
      qdrant:
        condition: service_healthy
    profiles:
      - ingestion

networks:
  app-network:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
